{% extends "base2.html" %}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/editarperfil.css') }}">
{% endblock %}

{% block content %}

<div class="center-content">

  <div class="profile-header">

    <div class="avatar">
      {% if usuario.foto %}
        <img src="{{ usuario.foto }}">
      {% else %}
        <img src="{{ url_for('static', filename='img/user.svg') }}">
      {% endif %}
      <b><span class="edit-text">Editar</span></b>
    </div>

    <div class="profile-info">
      <p>Nome: {{ usuario.nome }}</p>
      <p>Matrícula: {{ usuario.matricula }}</p>
      <p>Email: {{ usuario.email }}</p>
      <p>Perfil: {{ usuario.perfil }}</p>
    </div>

  </div>

  <form class="profile-form" method="POST">

    <label>Nome:</label>
    <input type="text" name="nome" value="{{ usuario.nome }}">

    <label>Telefone:</label>
    <input type="text" name="telefone" value="{{ usuario.telefone }}">

    <label>Data de nascimento:</label>
    <input type="date" name="nascimento"
           value="{{ usuario.nascimento.strftime('%Y-%m-%d') if usuario.nascimento else '' }}">

    <button type="submit" class="btn-save">
      Salvar alterações
    </button>

  </form>

  <form action="{{ url_for('excluir_usuario') }}" method="post"
        onsubmit="return confirm('Tem certeza que deseja excluir sua conta?');">

    <button type="submit" class="btn-delete">
      Excluir Conta
    </button>

  </form>

</div>

{% endblock %}
